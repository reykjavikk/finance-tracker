<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | Финансовый Трекер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .auth-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            color: #1a1f36;
            text-align: center;
        }
        .auth-card p.subtitle {
            text-align: center;
            color: #697386;
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 15px;
        }

        /* Стилизация стандартного вывода django (form.as_p) */
        .auth-form p {
            margin-bottom: 20px;
        }
        .auth-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #4f566b;
            font-size: 14px;
        }
        .auth-form input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d8e2e7;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .auth-form input:focus {
            border-color: #5469d4;
            outline: none;
            box-shadow: 0 0 0 3px rgba(84, 105, 212, 0.15);
        }

        /* Оформление ошибок валидации */
        .auth-form .errorlist {
            color: #df1b41;
            list-style: none;
            padding: 0;
            margin: 6px 0 15px 0;
            font-size: 13px;
            font-weight: 500;
        }
        .auth-form .errorlist li::before {
            content: "⚠️ ";
        }

        .btn-submit {
            width: 100%;
            background-color: #5469d4;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #4354b6;
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #697386;
        }
        .auth-footer a {
            color: #5469d4;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Войти в кошелек</h2>
    <p class="subtitle">Добро пожаловать обратно в свой финансовый кабинет</p>

    <form method="POST" action="" class="auth-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-submit">Войти</button>
    </form>

    <div class="auth-footer">
        Нет аккаунта? <a href="{% url 'wallet:register' %}">Создать профиль</a>
    </div>
</div>

</body>
</html>
